name: lmcache-fleet - Docker Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dockerfile-lint:
    name: lmcache-fleet - Dockerfile Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Reads .hadolint.yaml from the repo root, which documents why DL3059 and
      # DL3013 are ignored rather than fixed.
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile

  compose-lint:
    name: lmcache-fleet - Compose Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # docker/docker-compose.yml is generated and gitignored, so there is no
      # checked-in file to lint. Linting the generator's *output* is the point:
      # it is what anyone running this actually feeds to compose. Both variants
      # are checked because L2_DEDUP=1 takes a different branch in the
      # generator -- it adds the plugin mount, a PYTHONPATH, and drops the
      # stimulators' --url.
      - name: Validate generated compose, stock fs adapter
        run: |
          NUM_SERVERS=3 SEQ=8 python3 scripts/gen_compose.py
          docker compose -f docker/docker-compose.yml config -q

      - name: Validate generated compose, L2 sim adapter
        run: |
          L2_DEDUP=1 L1_GIB=0.05 L2_READ_DELAY_MS=5 L2_DELAY_JITTER=0.2 \
            NUM_SERVERS=2 SEQ=40 python3 scripts/gen_compose.py
          docker compose -f docker/docker-compose.yml config -q

      # L2_CAPACITY_GIB swaps the backing adapter and adds an eviction block, a
      # third shape of the --l2-adapter JSON. The block has to sit on the
      # outermost spec: inside the plugin's "inner" LMCache ignores it without
      # a word, so its position is asserted rather than left to the eye.
      - name: Validate generated compose, L2 capacity and eviction
        run: |
          L2_DEDUP=1 L2_CAPACITY_GIB=0.1 NUM_SERVERS=2 SEQ=40 python3 scripts/gen_compose.py
          docker compose -f docker/docker-compose.yml config -q
          python3 - <<'PY'
          import json, re
          text = open("docker/docker-compose.yml").read()
          spec = json.loads(re.search(r"--l2-adapter '(.*)'", text).group(1))
          inner = spec["adapter_params"]["inner"]
          assert spec["type"] == "plugin" and "eviction" in spec, spec
          assert inner["type"] == "fs_native" and inner["max_capacity_gb"] == 0.1, inner
          print("eviction block on the outermost spec, capacity on fs_native")
          PY

      # L2_SHARED adds a second --l2-adapter per server, SHARE_GROUPS deals the
      # servers across shared directories, and TRACE adds the trace-N services.
      # What is asserted is what breaks without a sound: the local tier has to
      # come first (a lookup takes the first adapter that holds the key), the
      # shared one has to be marked shared, and each server needs its own temp
      # dir in it -- with one name between them, two servers storing a block
      # rename each other's file away. The trace is a stub: the generator only
      # checks that one is there.
      - name: Validate generated compose, shared L2 tier and trace replay
        run: |
          mkdir -p data/traces/stub && touch data/traces/stub/index.jsonl
          L2_DEDUP=1 L2_SHARED=1 SHARE_GROUPS=2 L2_CAPACITY_GIB=0.1 \
            TRACE=stub TRACE_ROUTE=request NUM_SERVERS=4 python3 scripts/gen_compose.py
          docker compose -f docker/docker-compose.yml --profile trace config -q
          python3 - <<'PY'
          import json, re
          text = open("docker/docker-compose.yml").read()
          servers = re.split(r"\n  lmcache-server-\d+:\n", text)[1:]
          assert len(servers) == 4, len(servers)
          tmp_dirs, mounts = set(), []
          for block in servers:
              block = block.split("\n  stim-")[0]
              local, shared = (json.loads(s) for s in re.findall(r"--l2-adapter '(.*)'", block))
              assert not local.get("shared") and "eviction" in local, local
              assert local["adapter_params"]["inner"]["base_path"] == "/data/l2", local
              inner = shared["adapter_params"]["inner"]
              assert shared["shared"] is True and inner["base_path"] == "/data/l2-shared", shared
              tmp_dirs.add(inner["relative_tmp_dir"])
              mounts.append(re.search(r"data/(l2-shared-\d+):/data/l2-shared", block).group(1))
          assert len(tmp_dirs) == 4, tmp_dirs
          assert mounts == ["l2-shared-1", "l2-shared-2"] * 2, mounts
          shards = re.findall(r"--shard (\d+) --shards (\d+) --route (\w+)", text)
          assert shards == [(str(i), "4", "request") for i in range(4)], shards
          print("local then shared, a temp dir per server, 2 groups of 2, 4 trace shards")
          PY

      - name: Reject an unsupported sharing setup
        run: |
          for bad in L2_SHARED=maybe SHARE_GROUPS=5 TRACE=missing; do
            if env "$bad" NUM_SERVERS=2 python3 scripts/gen_compose.py 2>/dev/null; then
              echo "generator accepted $bad" >&2
              exit 1
            fi
          done

      # NUM_COORD is the one input the generator is documented to reject. If it
      # ever stops rejecting it, the fleet silently builds a split-brain key
      # directory, so the failure path is worth a check of its own.
      - name: Reject an unsupported fleet shape
        run: |
          if NUM_COORD=2 python3 scripts/gen_compose.py 2>/dev/null; then
            echo "generator accepted NUM_COORD=2; v0.5.8 has no clustering" >&2
            exit 1
          fi
