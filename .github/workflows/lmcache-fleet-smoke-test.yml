name: lmcache-fleet - Smoke Test

# Runs on main as well as on PRs, for two reasons: the README badge is pinned
# with ?branch=main and needs a run there to report, and the buildx cache is
# scoped per branch with a fallback to the default branch -- so a main run is
# what populates the cache every PR then reads.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Two fleet shapes. A PR gates the merge, so it runs the small verified
  # recipe from the README -- 2 servers, 40 sequences -- and stays quick. A
  # push to main gates nothing and is what the published dashboard comes from,
  # so it runs wider and longer: 4 servers and 5x the sequences, which is also
  # the only place the fleet is exercised past the 2-server case.
  NUM: ${{ github.event_name == 'push' && 4 || 2 }}
  SEQ: ${{ github.event_name == 'push' && 200 || 40 }}
  # L1 small enough that the sequences overflow it, and dedup on so the L2
  # spill costs ~1 MB per server instead of ~81 MB. Both tiers end up
  # populated, which is what makes this a fleet test rather than a start-up
  # test.
  L1_GIB: 0.05
  L2_DEDUP: 1
  LMCACHE_IMAGE: lmcache-fleet-demo/lmcache:0.5.8-cpu
  # The 15s default needs two polls, and therefore half a minute, before the
  # directory-exporter panels have a line to draw.
  DIRECTORY_POLL: 5

jobs:
  smoke-test:
    name: lmcache-fleet - Smoke Test (${{ matrix.l2 }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Two L2 modes, because they are different code paths end to end: a
    # different backing adapter, an eviction controller that either exists or
    # does not, and DELETE events the unbounded fleet never sends. A PR runs
    # both side by side, so neither can break unnoticed. main runs only the
    # capped one: it publishes a single dashboard, and the one with L2 turning
    # over shows everything the unbounded one does and more.
    strategy:
      fail-fast: false
      matrix:
        l2: ${{ github.event_name == 'push' && fromJSON('["capped"]') || fromJSON('["unbounded", "capped"]') }}
    env:
      # Sized against what each server stores, so the cap is always crossed:
      # 1 MiB per block and two blocks per sequence is 80 MiB on a PR and
      # 400 MiB on main, against 0.05 GiB and 0.2 GiB. `make check` reads this
      # too, and with it set requires every server to have actually evicted.
      L2_CAPACITY_GIB: ${{ matrix.l2 == 'capped' && (github.event_name == 'push' && '0.2' || '0.05') || '0' }}
    # Needed only by the gh-pages publish below, which is why it is the one
    # scope granted rather than leaving the token at whatever the repo default
    # happens to be.
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      # The fleet's image is built, never pulled, so this is also what gives
      # the Dockerfile continuous test coverage rather than only testing it
      # when someone remembers to. Built here with the action rather than via
      # `make image` so the layer cache is shared across runs.
      - name: Build the CPU-only image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ env.LMCACHE_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install playwright chromium
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      # make run = gen + up + stim: the compose file comes from the generator,
      # the same path a local run takes. The stimulators are one-shot and wait
      # on the servers' healthchecks themselves.
      - name: Start the fleet and run the stimulators
        run: |
          echo "FLEET_START=$(date +%s)" >> "$GITHUB_ENV"
          make run NUM=$NUM SEQ=$SEQ

      # Resolved through compose rather than by guessing the generated
      # <project>-<service>-1 container name, which the generator is free to
      # change.
      - name: Wait for the stimulators to finish
        run: |
          for i in $(seq 1 "$NUM"); do
            cid=$(docker compose -f docker/docker-compose.yml --profile stim ps -aq "stim-$i")
            if [ -z "$cid" ]; then echo "stim-$i never started" >&2; exit 1; fi
            status=$(docker wait "$cid")
            echo "stim-$i exited $status"
            [ "$status" = "0" ] || exit 1
          done

      # In the capped mode this also requires each server to have evicted from
      # L2 and to sit within its capacity. Both tiers fill whether or not the
      # capacity is enforced, so without that the capped leg would pass on a
      # fleet that silently ignored it.
      - name: Check the key directory
        run: make check NUM=$NUM

      # The read side. The stimulators only store, so nothing has been fetched
      # back yet; this samples each server's window and retrieves what is
      # there, from L1 where it still is and through L2 where it has spilled.
      # Each restore fails below RESTORE_MIN_HIT_RATE, set low rather than at 1:
      # in the capped mode most of the window has been evicted on purpose, and
      # what is being asserted is that restores find blocks, not all of them.
      - name: Run the restore stimulators
        env:
          RESTORE_MIN_HIT_RATE: 0.1
        run: |
          make restore NUM=$NUM SEQ=$SEQ
          for i in $(seq 1 "$NUM"); do
            cid=$(docker compose -f docker/docker-compose.yml --profile restore ps -aq "restore-$i")
            if [ -z "$cid" ]; then echo "restore-$i never started" >&2; exit 1; fi
            status=$(docker wait "$cid")
            docker logs "$cid" 2>&1 | grep -E '^\{|^FAIL' || true
            echo "restore-$i exited $status"
            [ "$status" = "0" ] || exit 1
          done

      - name: Report
        run: make report NUM=$NUM

      # Proof the monitoring half of the stack works end to end: Prometheus
      # scraped the exporter, the exporter read the coordinator, and the
      # dashboard rendered it. A green check cannot show that; the image can.
      # The dashboard window is set to the fleet's actual lifetime, rounded up
      # a minute. A fixed range leaves the run as a spike at the right edge of
      # otherwise empty charts, and Grafana prints the range it is showing, so
      # matching it is also what makes the screenshot state its own period.
      - name: Screenshot the Grafana dashboard
        run: |
          mins=$(( ( $(date +%s) - FLEET_START ) / 60 + 1 ))
          echo "fleet has been up ~${mins}m; capturing that window"
          echo "WINDOW_MINS=$mins" >> "$GITHUB_ENV"
          make shot SHOT=grafana.png SETTLE=20 WINDOW="${mins}m"

      # Kept for PR runs, where there is nothing to publish to: the artifact is
      # how you see a PR's own dashboard before it merges.
      - name: Upload the dashboard screenshot
        uses: actions/upload-artifact@v7
        with:
          name: grafana-dashboard-${{ matrix.l2 }}
          path: grafana.png
          if-no-files-found: error

      # Artifact URLs are per-run and expire, so the README badge cannot point
      # at one. main publishes to gh-pages instead, which gives the screenshot
      # a stable URL that always shows the current dashboard. Push only: a PR
      # from a fork has no write token, and a PR's dashboard is not the one the
      # badge should be advertising.
      - name: Build the Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp grafana.png site/grafana-dashboard.png
          cat > site/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>LMCache Fleet — dashboard</title>
          <style>
            body { background:#111217; color:#d8d9da; margin:0;
                   font:14px/1.5 system-ui, sans-serif; }
            header { padding:16px 24px; border-bottom:1px solid #2c2d31; }
            a { color:#6e9fff; }
            img { display:block; width:100%; height:auto; }
          </style>
          <header>
            <strong>LMCache Fleet</strong> — Grafana dashboard from the last
            <a href="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}">smoke-test run</a>
            on main (<code>${GITHUB_SHA}</code>): a ${NUM}-server fleet storing
            ${SEQ} sequences each into an L2 capped at ${L2_CAPACITY_GIB} GiB per
            server, so L1 spills to L2 and L2 evicts in turn. The dashboard
            covers the fleet's whole lifetime, about ${WINDOW_MINS} minute(s).
          </header>
          <img src="grafana-dashboard.png" alt="LMCache fleet Grafana dashboard">
          HTML

      - name: Publish to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "chore: refresh dashboard screenshot"

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --profile stim --profile restore logs --no-color --tail=200 > fleet-logs.txt 2>&1 || true
          docker compose -f docker/docker-compose.yml ps --all >> fleet-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-logs-${{ matrix.l2 }}
          path: fleet-logs.txt
          if-no-files-found: ignore

      # Tolerant on purpose: if the image build failed there is no generated
      # compose file to tear down, and a teardown error on top of the real
      # failure only buries it.
      - name: Tear down
        if: always()
        run: make clean NUM=$NUM || true

  # The other workload and the other topology: a token trace replayed against
  # servers that have a shared L2 behind their own. Its own job rather than
  # more steps above, because L2_SHARED changes every server's definition and
  # compose would recreate the fleet the legs above are asserting on.
  trace-replay:
    name: lmcache-fleet - Smoke Test (trace, shared L2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUM: 2
      # A trace chunk is 8 KiB, not 1 MiB, so L1 has to be smaller still for
      # the replay to overflow it and read back through L2.
      L1_GIB: 0.02
      L2_SHARED: 1
      TRACE: synth
      # Every request of a session goes to the next server, so a server has
      # none of the session's history of its own. With local L2s alone the
      # most this trace can hit on two servers is 88.8% (`make trace-analyze`);
      # with a shared tier it is 94.0%, and a run measures 93.4%. A floor of
      # 0.9 therefore fails unless the shared tier is serving blocks.
      TRACE_ROUTE: request
      TRACE_SPEEDUP: 20
      TRACE_MIN_HIT_RATE: 0.9
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the CPU-only image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ env.LMCACHE_IMAGE }}
          load: true
          cache-from: type=gha

      # Synthetic, so the lane needs no download and no tokenizer: 40 sessions
      # from a fixed seed, which is what makes the numbers above reproducible.
      - name: Generate a token trace
        run: make trace-synth NAME=$TRACE

      - name: Start the fleet and replay the trace
        run: |
          make up NUM=$NUM
          make trace NUM=$NUM

      - name: Wait for the replay to finish
        run: |
          for i in $(seq 1 "$NUM"); do
            cid=$(docker compose -f docker/docker-compose.yml --profile trace ps -aq "trace-$i")
            if [ -z "$cid" ]; then echo "trace-$i never started" >&2; exit 1; fi
            status=$(docker wait "$cid")
            docker logs "$cid" 2>&1 | grep -E '^\{|^FAIL' || true
            echo "trace-$i exited $status"
            [ "$status" = "0" ] || exit 1
          done

      # The hit-rate floor is indirect evidence. This is the direct kind: a hit
      # on a chunk the client never stored on its own server.
      - name: Require hits served from another server
        run: make trace-report REPORT_ARGS=--require-remote

      - name: Report
        run: make report NUM=$NUM

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --profile trace logs --no-color --tail=200 > fleet-logs.txt 2>&1 || true
          docker compose -f docker/docker-compose.yml ps --all >> fleet-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-logs-trace
          path: fleet-logs.txt
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: make clean NUM=$NUM || true
