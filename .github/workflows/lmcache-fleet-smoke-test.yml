name: lmcache-fleet - Smoke Test

# Runs on main as well as on PRs, for two reasons: the README badge is pinned
# with ?branch=main and needs a run there to report, and the buildx cache is
# scoped per branch with a fallback to the default branch -- so a main run is
# what populates the cache every PR then reads.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Two fleet shapes. A PR gates the merge, so it runs the small verified
  # recipe from the README -- 2 servers, 40 sequences -- and stays quick. A
  # push to main gates nothing and is what the published dashboard comes from,
  # so it runs wider and longer: 4 servers and 5x the sequences, which is also
  # the only place the fleet is exercised past the 2-server case.
  NUM: ${{ github.event_name == 'push' && 4 || 2 }}
  SEQ: ${{ github.event_name == 'push' && 200 || 40 }}
  # L1 small enough that the sequences overflow it, and dedup on so the L2
  # spill costs ~1 MB per server instead of ~81 MB. Both tiers end up
  # populated, which is what makes this a fleet test rather than a start-up
  # test.
  L1_GB: 0.05
  L2_DEDUP: 1
  LMCACHE_IMAGE: lmcache-fleet-demo/lmcache:0.5.8-cpu
  # The 15s default needs two polls, and therefore half a minute, before the
  # directory-exporter panels have a line to draw.
  DIRECTORY_POLL: 5

jobs:
  smoke-test:
    name: lmcache-fleet - Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Needed only by the gh-pages publish below, which is why it is the one
    # scope granted rather than leaving the token at whatever the repo default
    # happens to be.
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      # The fleet's image is built, never pulled, so this is also what gives
      # the Dockerfile continuous test coverage rather than only testing it
      # when someone remembers to. Built here with the action rather than via
      # `make image` so the layer cache is shared across runs.
      - name: Build the CPU-only image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ env.LMCACHE_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install playwright chromium
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      # make run = gen + up + stim: the compose file comes from the generator,
      # the same path a local run takes. The stimulators are one-shot and wait
      # on the servers' healthchecks themselves.
      - name: Start the fleet and run the stimulators
        run: |
          echo "FLEET_START=$(date +%s)" >> "$GITHUB_ENV"
          make run NUM=$NUM SEQ=$SEQ

      # Resolved through compose rather than by guessing the generated
      # <project>-<service>-1 container name, which the generator is free to
      # change.
      - name: Wait for the stimulators to finish
        run: |
          for i in $(seq 1 "$NUM"); do
            cid=$(docker compose -f docker/docker-compose.yml --profile stim ps -aq "stim-$i")
            if [ -z "$cid" ]; then echo "stim-$i never started" >&2; exit 1; fi
            status=$(docker wait "$cid")
            echo "stim-$i exited $status"
            [ "$status" = "0" ] || exit 1
          done

      - name: Check the key directory
        run: make check NUM=$NUM

      - name: Report
        run: make report NUM=$NUM

      # Proof the monitoring half of the stack works end to end: Prometheus
      # scraped the exporter, the exporter read the coordinator, and the
      # dashboard rendered it. A green check cannot show that; the image can.
      # The dashboard window is set to the fleet's actual lifetime, rounded up
      # a minute. A fixed range leaves the run as a spike at the right edge of
      # otherwise empty charts, and Grafana prints the range it is showing, so
      # matching it is also what makes the screenshot state its own period.
      - name: Screenshot the Grafana dashboard
        run: |
          mins=$(( ( $(date +%s) - FLEET_START ) / 60 + 1 ))
          echo "fleet has been up ~${mins}m; capturing that window"
          echo "WINDOW_MINS=$mins" >> "$GITHUB_ENV"
          make shot SHOT=grafana.png SETTLE=20 WINDOW="${mins}m"

      # Kept for PR runs, where there is nothing to publish to: the artifact is
      # how you see a PR's own dashboard before it merges.
      - name: Upload the dashboard screenshot
        uses: actions/upload-artifact@v7
        with:
          name: grafana-dashboard
          path: grafana.png
          if-no-files-found: error

      # Artifact URLs are per-run and expire, so the README badge cannot point
      # at one. main publishes to gh-pages instead, which gives the screenshot
      # a stable URL that always shows the current dashboard. Push only: a PR
      # from a fork has no write token, and a PR's dashboard is not the one the
      # badge should be advertising.
      - name: Build the Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp grafana.png site/grafana-dashboard.png
          cat > site/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>LMCache Fleet — dashboard</title>
          <style>
            body { background:#111217; color:#d8d9da; margin:0;
                   font:14px/1.5 system-ui, sans-serif; }
            header { padding:16px 24px; border-bottom:1px solid #2c2d31; }
            a { color:#6e9fff; }
            img { display:block; width:100%; height:auto; }
          </style>
          <header>
            <strong>LMCache Fleet</strong> — Grafana dashboard from the last
            <a href="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}">smoke-test run</a>
            on main (<code>${GITHUB_SHA}</code>): a ${NUM}-server fleet storing
            ${SEQ} sequences each, with L1 and L2 both populated. The dashboard
            covers the fleet's whole lifetime, about ${WINDOW_MINS} minute(s).
          </header>
          <img src="grafana-dashboard.png" alt="LMCache fleet Grafana dashboard">
          HTML

      - name: Publish to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "chore: refresh dashboard screenshot"

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --profile stim logs --no-color --tail=200 > fleet-logs.txt 2>&1 || true
          docker compose -f docker/docker-compose.yml ps --all >> fleet-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-logs
          path: fleet-logs.txt
          if-no-files-found: ignore

      # Tolerant on purpose: if the image build failed there is no generated
      # compose file to tear down, and a teardown error on top of the real
      # failure only buries it.
      - name: Tear down
        if: always()
        run: make clean NUM=$NUM || true
