name: lmcache-fleet - Spell Check

# PR only: every commit reaches main through a PR merge, so a post-merge run
# would re-check a tree this already passed on. Never path-filtered, which is
# also what a required check needs -- see lmcache-fleet-shell-check.yml.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spell-check:
    name: lmcache-fleet - Spell Check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install codespell
        run: pipx install codespell==2.4.3

      # No arguments: codespell reads .codespellrc from the repo root, so a
      # local run and this one are the same command.
      - name: Run codespell
        run: codespell
