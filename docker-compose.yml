# Generated by gen_compose.py — LMCache v0.5.8 MP fleet
# 2 MP servers (L1 DRAM + L2 fs) + 1 coordinator + 2 stimulators.
# Regenerate with: NUM_SERVERS=<n> SEQ=<seqs> python3 gen_compose.py

networks:
  fleet:
    driver: bridge

services:
  coordinator:
    image: lmcache/standalone:v0.5.8
    container_name: coordinator
    hostname: coordinator
    networks: [fleet]
    ports:
      - "127.0.0.1:9300:9300"
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:9300/healthz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    command: >
      /opt/venv/bin/lmcache coordinator
      --host 0.0.0.0 --port 9300
      --chunk-size 256
      --instance-timeout 30

  lmcache-server-1:
    image: lmcache/standalone:v0.5.8
    container_name: lmcache-server-1
    hostname: lmcache-server-1
    ipc: shareable
    shm_size: 512m
    networks: [fleet]
    ports:
      - "127.0.0.1:8181:8080"   # HTTP API on host for /status, /cache/objects
    volumes:
      - ./data/l2-server-1:/data/l2              # per-server L2 backend (fs adapter)
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthcheck',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    command: >
      /opt/venv/bin/lmcache server
      --host 0.0.0.0 --port 5555
      --http-host 0.0.0.0 --http-port 8080
      --chunk-size 256
      --l1-size-gb 0.05
      --eviction-policy LRU
      --eviction-trigger-watermark 0.8
      --supported-transfer-mode auto
      --shm-name fleet1 --no-l1-use-lazy
      --coordinator-url http://coordinator:9300
      --coordinator-advertise-ip lmcache-server-1
      --coordinator-event-reporting
      --l2-adapter '{"type":"fs","base_path":"/data/l2"}'

  lmcache-server-2:
    image: lmcache/standalone:v0.5.8
    container_name: lmcache-server-2
    hostname: lmcache-server-2
    ipc: shareable
    shm_size: 512m
    networks: [fleet]
    ports:
      - "127.0.0.1:8182:8080"   # HTTP API on host for /status, /cache/objects
    volumes:
      - ./data/l2-server-2:/data/l2              # per-server L2 backend (fs adapter)
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthcheck',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    command: >
      /opt/venv/bin/lmcache server
      --host 0.0.0.0 --port 5555
      --http-host 0.0.0.0 --http-port 8080
      --chunk-size 256
      --l1-size-gb 0.05
      --eviction-policy LRU
      --eviction-trigger-watermark 0.8
      --supported-transfer-mode auto
      --shm-name fleet2 --no-l1-use-lazy
      --coordinator-url http://coordinator:9300
      --coordinator-advertise-ip lmcache-server-2
      --coordinator-event-reporting
      --l2-adapter '{"type":"fs","base_path":"/data/l2"}'

  stimulate-1:
    image: lmcache/standalone:v0.5.8
    profiles: [stimulate]
    ipc: service:lmcache-server-1          # share /dev/shm so bench's CPU SHM path reaches the server
    shm_size: 512m
    networks: [fleet]
    depends_on:
      lmcache-server-1:
        condition: service_healthy
    command: >
      /opt/venv/bin/lmcache bench server
      --rpc-url tcp://lmcache-server-1:5555
      --url http://lmcache-server-1:8080
      --mode cpu --transfer-mode lmcache_driven
      --kvcache-shape-spec "(2,64,16,4,64):float16:4"
      --num-tokens 512
      --start 0 --end 40
      --interval 0.2

  stimulate-2:
    image: lmcache/standalone:v0.5.8
    profiles: [stimulate]
    ipc: service:lmcache-server-2          # share /dev/shm so bench's CPU SHM path reaches the server
    shm_size: 512m
    networks: [fleet]
    depends_on:
      lmcache-server-2:
        condition: service_healthy
    command: >
      /opt/venv/bin/lmcache bench server
      --rpc-url tcp://lmcache-server-2:5555
      --url http://lmcache-server-2:8080
      --mode cpu --transfer-mode lmcache_driven
      --kvcache-shape-spec "(2,64,16,4,64):float16:4"
      --num-tokens 512
      --start 0 --end 40
      --interval 0.2
